<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- Render at the phone's real width instead of as a zoomed-out desktop page, and use the whole screen around the notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Rubik's Cube Simulation</title>
    <style>html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;background:#000;height:100%;margin:0;overflow:hidden}canvas{display:block}.toolbar{gap:12px;display:flex;position:fixed;bottom:32px;left:50%;transform:translate(-50%)}button{color:#111;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:#e8e8e8;border:none;border-radius:10px;padding:12px 28px;font:600 18px system-ui,sans-serif}@media (hover:hover){button:hover:not(:disabled){background:#fff}}button:active:not(:disabled){background:#fff}button:disabled{opacity:.4;cursor:default}#move-buttons{flex-direction:column;gap:8px;display:flex;position:fixed;top:50%;right:24px;transform:translateY(-50%)}.move-row{border-left:6px solid var(--face-color);border-radius:3px;gap:6px;padding-left:10px;display:flex}.move-row button{width:56px;padding:8px 0;font-size:16px}#scramble-text{color:#e8e8e8;white-space:nowrap;font:500 18px ui-monospace,Menlo,monospace;position:fixed;top:24px;left:50%;transform:translate(-50%)}@media (width<=700px){.toolbar{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));gap:8px;transform:none}.toolbar button{flex:1;min-height:44px;padding:0 4px;font-size:15px}#move-buttons{top:auto;left:16px;right:16px;bottom:calc(16px + 44px + 12px + env(safe-area-inset-bottom));flex-direction:row;gap:8px;transform:none}.move-row{border-left:none;border-top:6px solid var(--face-color);flex-direction:column;flex:1;padding:8px 0 0}.move-row button{width:100%;min-height:44px;padding:0}#scramble-text{top:calc(12px + env(safe-area-inset-top));white-space:normal;text-align:center;font-size:14px;left:16px;right:16px;transform:none}}@media (width<=360px){.toolbar button{font-size:13px}}@media (height<=500px) and (width>=701px){.toolbar{left:calc(16px + env(safe-area-inset-left));flex-direction:column;gap:8px;top:50%;bottom:auto;transform:translateY(-50%)}.toolbar button{min-height:44px;padding:0 16px;font-size:15px}#move-buttons{right:calc(16px + env(safe-area-inset-right));gap:4px}.move-row button{width:48px;min-height:44px;padding:0}#scramble-text{top:calc(8px + env(safe-area-inset-top));white-space:normal;text-align:center;width:60vw;font-size:14px}}</style>
  <script type="module" crossorigin src="/Rubik-s-Cube-Three.js-Simulation/assets/index-DVVDq-JJ.js"></script>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="scramble-text"></div>
    <div id="move-buttons"></div>
    <div class="toolbar">
        <button id="scramble" title="Mix up the cube with 25 random moves">Scramble</button>
        <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
        <button id="reset" title="Rewind every move back to solved">Reset</button>
    </div>
</body>

</html>
